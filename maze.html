<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Track · 移动迷宫（巨墙扇区）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14181d;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; color: #f1f3f4; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #view:active { cursor: grabbing; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(8,11,15,.48) 100%); }
  .panel { position: fixed; background: rgba(16,21,26,.66); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 12px 14px; }
  #top { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px 8px; }
  #top h1 { font-size: 14px; margin: 0 8px 0 6px; white-space: nowrap; font-weight: 600; letter-spacing: .5px; }
  button, a.btn { font: inherit; font-size: 13px; border: 0; border-radius: 7px; padding: 6px 11px; background: rgba(255,255,255,.1);
    color: #f1f3f4; cursor: pointer; white-space: nowrap; text-decoration: none; }
  button:hover, a.btn:hover { background: rgba(255,255,255,.2); }
  button.on { background: #f1f3f4; color: #14181d; }
  button:disabled { opacity: .4; cursor: default; }
  #task { top: 62px; left: 12px; width: 268px; font-size: 12.5px; line-height: 1.65; color: #d9dee1; }
  #task h3 { margin: 0 0 6px; font-size: 13px; color: #fff; font-weight: 600; }
  #task b { display: inline-block; width: 58px; color: #9fb0ba; font-weight: 500; }
  #stats { top: 62px; right: 12px; display: flex; gap: 14px; padding: 8px 14px; }
  #stats div { text-align: center; min-width: 64px; }
  #stats strong { display: block; font-size: 20px; color: #ffb74d; font-weight: 600; }
  #stats small { color: #9fb0ba; font-size: 11.5px; }
  #bottom { left: 50%; bottom: 16px; transform: translateX(-50%); width: min(840px, 92vw); text-align: center; padding: 10px 14px; }
  #msg { font-size: 15px; min-height: 22px; color: #fff; }
  #actions { display: none; margin-top: 10px; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #actions button { min-width: 104px; padding: 8px 12px; }
  #actions button.go { background: #ef6c00; }
  #actions button.stop { background: #c2185b; }
  #hint { margin-top: 6px; font-size: 11.5px; color: #9fb0ba; }
  kbd { font: 10.5px monospace; background: rgba(255,255,255,.14); border-radius: 3px; padding: 1px 4px; margin: 0 2px; color: #e6eaec; }
  #godwrap { right: 12px; bottom: 16px; padding: 8px; display: none; }
  #godwrap div { font-size: 11.5px; color: #9fb0ba; margin-bottom: 4px; }
  #god { display: block; border-radius: 6px; }
  #result { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 372px; display: none; padding: 18px 20px;
    background: rgba(16,21,26,.96); }
  #result h2 { margin: 0 0 10px; font-size: 20px; }
  #result .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; font-size: 14px; margin-bottom: 14px; }
  #result .kv b { color: #9fb0ba; font-weight: 500; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #14181d; font-size: 17px; z-index: 10; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
<div id="loading">正在升起巨墙迷宫…</div>

<div class="panel" id="top">
  <h1>Space Track · 移动迷宫</h1>
  <a class="btn" href="home.html">首页</a>
  <button id="godBtn">上帝视角 <kbd>G</kbd></button>
  <button id="resetBtn">重新开始 <kbd>R</kbd></button>
</div>

<div class="panel" id="task"></div>

<div class="panel" id="stats">
  <div><strong id="steps">–</strong><small>动作步数</small></div>
  <div><strong id="walked">0</strong><small>已走（米）</small></div>
</div>

<div class="panel" id="bottom">
  <div id="msg"></div>
  <div id="hint"></div>
</div>

<div class="panel" id="godwrap"><div>上帝视角（调试用，AI 看不到）</div><canvas id="god" width="380" height="275"></canvas></div>

<div class="panel" id="result"></div>

<script src="vendor/three.min.js"></script>
<script src="world.js"></script>
<script src="tex/park/textures.js"></script>
<script src="scene.js"></script>
<script src="tasks.js"></script>
<script src="nav.js"></script>
<script src="game.js"></script>
</body>
</html>
